<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sincere Apology 🎀</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            background-color: #FFE4E1;
            /* استدعاء الصورة باسمها المباشر المرفوع بجانب ملف الـ html */
            background-image: url('wp8637321.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
            padding: 40px 20px;
        }

        h1 {
            color: #6B4E5B;
            font-size: 1.7rem;
            z-index: 10;
            text-align: center;
            line-height: 1.4;
            background-color: rgba(255, 245, 247, 0.9); /* إطار ناعم وواضح جداً فوق الخلفية */
            padding: 15px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-top: 10px;
            max-width: 90%;
            animation: popIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .buttons-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
            margin-bottom: 30px;
            animation: popIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        #yesBtn {
            background-color: #E28F9D;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.15rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(226, 143, 157, 0.4);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
            z-index: 12;
            animation: pulse 1.5s infinite alternate;
        }

        #noBtn {
            background-color: #E0E0E0;
            color: #555;
            border: none;
            padding: 13px 28px;
            font-size: 1.05rem;
            font-weight: 500;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 11;
            white-space: nowrap;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.8) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 5px 15px rgba(226, 143, 157, 0.4); }
            100% { transform: scale(1.05); box-shadow: 0 8px 25px rgba(226, 143, 157, 0.6); }
        }

        .heart {
            position: absolute;
            color: #FBC4CB;
            font-size: 16px;
            animation: fall linear forwards;
            z-index: 1;
            user-select: none;
            pointer-events: none;
        }

        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); }
        }

        .custom-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(107, 78, 91, 0.4);
            z-index: 100;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            width: 85%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-content h2 {
            color: #6B4E5B;
            font-size: 1.5rem;
            margin-top: 0;
        }

        .modal-content p {
            color: #666;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .modal-content button {
            background-color: #E28F9D;
            color: white;
            border: none;
            padding: 10px 30px;
            font-size: 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <h1>I sincerely apologize for the misunderstanding.<br>Do you accept my apology? ✨</h1>

    <div class="buttons-container" id="container">
        <button id="yesBtn" onclick="acceptApology()">Yes, I accept 😊</button>
        <button id="noBtn" onmouseover="moveNo()" onclick="moveNo()" ontouchstart="moveNo()">No 🚫</button>
    </div>

    <div class="custom-modal" id="myModal">
        <div class="modal-content" id="modalContent">
            <h2>Thank you so much! ✨🌸</h2>
            <p>I truly appreciate your kindness and understanding. Wishing you all the best!</p>
            <button onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        let yesSize = 1.15;
        let paddingX = 35;
        let paddingY = 15;
        let hasMoved = false;

        function moveNo() {
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');
            const container = document.getElementById('container');
            
            yesBtn.style.animation = 'none';

            if (!hasMoved) {
                noBtn.style.position = 'absolute';
                yesBtn.style.position = 'absolute';
                hasMoved = true;
            }

            const maxX = container.clientWidth - noBtn.clientWidth;
            const maxY = container.clientHeight - noBtn.clientHeight;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';

            yesSize += 0.35;
            paddingX += 12;
            paddingY += 6;
            
            yesBtn.style.fontSize = yesSize + 'rem';
            yesBtn.style.padding = `${paddingY}px ${paddingX}px`;

            if(yesSize > 4.0) {
                yesBtn.style.position = 'fixed';
                yesBtn.style.top = '0';
                yesBtn.style.left = '0';
                yesBtn.style.width = '100vw';
                yesBtn.style.height = '100vh';
                yesBtn.style.borderRadius = '0';
                yesBtn.style.display = 'flex';
                yesBtn.style.alignItems = 'center';
                yesBtn.style.justifyContent = 'center';
                noBtn.style.display = 'none';
            }
        }

        function acceptApology() {
            const modal = document.getElementById('myModal');
            const modalContent = document.getElementById('modalContent');
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.style.opacity = '1';
                modalContent.style.transform = 'scale(1)';
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('myModal');
            const modalContent = document.getElementById('modalContent');
            modal.style.opacity = '0';
            modalContent.style.transform = 'scale(0.8)';
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '🌸';
            if (Math.random() > 0.5) {
                heart.innerHTML = '💖';
            }
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2.5 + 2 + 's'; 
            heart.style.fontSize = Math.random() * 12 + 14 + 'px';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 4500);
        }

        setInterval(createHeart, 250);
    </script>
</body>
</html>
