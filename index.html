<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sincere Apology 🎀</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            /* استخدام صورتكِ اللطيفة كخلفية كاملة متناسقة */
            background-image: url('https://raw.githubusercontent.com/charefoussama598/sorry/main/1ca9527ac1d06d633fb198ace8f00cc4.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
            padding: 40px 20px;
        }

        h1 {
            color: #6B4E5B; /* موف داكن وأنيق للزمالة */
            font-size: 1.8rem;
            z-index: 10;
            text-align: center;
            line-height: 1.4;
            background-color: rgba(255, 240, 245, 0.85); /* خلفية ضبابية خفيفة لتسهيل القراءة */
            padding: 15px 25px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-top: 20px;
            animation: fadeIn 1s ease-in-out;
        }

        /* حاوية الأزرار في الأسفل لتعطي مساحة هروب ممتازة */
        .buttons-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
            margin-bottom: 40px;
        }

        #yesBtn {
            background-color: #E28F9D; /* وردي راقي */
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 1.1rem;
            font-weight: 500;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(226, 143, 157, 0.4);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
            z-index: 12;
        }

        #noBtn {
            background-color: #E0E0E0; /* رمادي حيادي */
            color: #666;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 11;
            white-space: nowrap;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* مطر الزهور الناعمة */
        .heart {
            position: absolute;
            color: #FBC4CB;
            font-size: 16px;
            animation: fall linear forwards;
            z-index: 1;
            user-select: none;
            pointer-events: none;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }

        /* النافذة المنبثقة الأنيقة عند القبول */
        .custom-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(107, 78, 91, 0.4);
            z-index: 100;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            width: 85%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-content h2 {
            color: #6B4E5B;
            font-size: 1.4rem;
            margin-top: 0;
        }

        .modal-content p {
            color: #888;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .modal-content button {
            background-color: #E28F9D;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 1rem;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>I sincerely apologize for the misunderstanding.<br>Do you accept my apology? ✨</h1>

    <div class="buttons-container" id="container">
        <button id="yesBtn" onclick="acceptApology()">Yes, I accept 😊</button>
        <button id="noBtn" onmouseover="moveNo()" onclick="moveNo()" ontouchstart="moveNo()">No 🚫</button>
    </div>

    <div class="custom-modal" id="myModal">
        <div class="modal-content" id="modalContent">
            <h2>Thank you so much! ✨🌸</h2>
            <p>I truly appreciate your kindness and understanding. Wishing you all the best!</p>
            <button onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        let yesSize = 1.1;
        let paddingX = 30;
        let paddingY = 14;
        let hasMoved = false;

        function moveNo() {
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');
            const container = document.getElementById('container');
            
            if (!hasMoved) {
                noBtn.style.position = 'absolute';
                yesBtn.style.position = 'absolute';
                hasMoved = true;
            }

            // حساب مساحة الهروب داخل حاوية الهاتف لضمان عدم الاختفاء
            const maxX = container.clientWidth - noBtn.clientWidth;
            const maxY = container.clientHeight - noBtn.clientHeight;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';

            // تضخيم زر نعم تدريجياً
            yesSize += 0.35;
            paddingX += 12;
            paddingY += 6;
            
            yesBtn.style.fontSize = yesSize + 'rem';
            yesBtn.style.padding = `${paddingY}px ${paddingX}px`;

            // تغطية كامل الشاشة لمنع الرفض نهائياً
            if(yesSize > 4.0) {
                yesBtn.style.position = 'fixed';
                yesBtn.style.top = '0';
                yesBtn.style.left = '0';
                yesBtn.style.width = '100vw';
                yesBtn.style.height = '100vh';
                yesBtn.style.borderRadius = '0';
                yesBtn.style.display = 'flex';
                yesBtn.style.alignItems = 'center';
                yesBtn.style.justifyContent = 'center';
                noBtn.style.display = 'none';
            }
        }

        function acceptApology() {
            const modal = document.getElementById('myModal');
            const modalContent = document.getElementById('modalContent');
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.style.opacity = '1';
                modalContent.style.transform = 'scale(1)';
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('myModal');
            const modalContent = document.getElementById('modalContent');
            modal.style.opacity = '0';
            modalContent.style.transform = 'scale(0.8)';
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        }

        // توليد حركة تساقط أزهار الكرز اللطيفة
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '🌸';
            if (Math.random() > 0.5) {
                heart.innerHTML = '💖';
            }
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 4 + 3 + 's';
            heart.style.fontSize = Math.random() * 10 + 12 + 'px';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        setInterval(createHeart, 450);
    </script>
</body>
</html>
